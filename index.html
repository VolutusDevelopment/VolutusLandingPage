<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Este archivo es la plantilla de TODAS las páginas: el prerender
      (scripts/prerender.mjs) escribe con él un HTML por ruta y completa el
      <head> a partir de src/lib/meta.js: título, descripción, canonical, Open
      Graph y datos estructurados. Aquí solo queda lo que es idéntico en todas.

      Es a propósito. Tener el título escrito a mano en cada HTML es lo que hace
      que un día la description del buscador diga una cosa y la página otra.
    -->
    <!--meta-->

    <!-- El ICO es para Safari y para quien no lee SVG. Con `sizes`, Chrome
         prefiere el SVG que sigue en vez de tomar el primero. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- El mismo símbolo a sangre y sin transparencia, para la pantalla de
         inicio del iPhone: iOS no usa el SVG y redondea las esquinas solo. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f9fc" />

    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/archivo-italica-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  <style>.prototipo{position:fixed;z-index:99;left:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 16px);font:600 13px/1 system-ui;background:#fff;padding:6px;border-radius:10px;box-shadow:0 4px 16px #0004}.prototipo a{padding:8px 10px;border-radius:6px;color:#10233b;text-decoration:none;background:#e8eef5}.prototipo a[aria-current]{background:#10233b;color:#fff}</style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  <nav class="prototipo" aria-label="Prototipo"></nav>
<script>(()=>{const q=new URLSearchParams(location.search),v=q.get('icono')||'calcomania',n=document.querySelector('.prototipo');document.documentElement.dataset.icono=v;if(q.get('luz')==='dorada'){const e=document.createElement('style');e.textContent='.portada-cielo{--nubes-luz:#ffe7c9!important}';document.head.append(e)}[['etiqueta','Etiqueta'],['baldosa','Baldosa'],['linea','En línea'],['calcomania','Calcomanía'],['trama','Trama'],['resplandor','Resplandor']].forEach(([k,t])=>{const a=document.createElement('a'),u=new URLSearchParams(q);u.set('icono',k);a.href='?'+u;a.textContent=t;if(k===v)a.setAttribute('aria-current','true');n.append(a)})})()</script>
</body>
</html>
